<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Contact Malia Aiello for bookings, casting and general inquiries, or reach her representation directly.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Lato:wght@400;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ===================== HEADER (solid version for inner pages) ===================== -->
<header class="site-header site-header--solid">
  <div class="container">
    <a class="logo" href="index.html">Malia Aiello</a>

    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav"><span></span></button>

    <nav class="nav" id="site-nav" aria-label="Main">
      <a href="index.html#work">Work</a>
      <a href="index.html#reel">Reels</a>
      <a href="index.html#press">Press</a>
      <a class="btn btn--pill btn--small" href="contact.html" aria-current="page">Contact</a>
    </nav>
  </div>
</header>

<main class="container contact">

  <!-- ===================== PAGE TITLE ===================== -->
  <div class="page-head">
    <h1 class="display">Contact</h1>
    <p>For all bookings, casting inquiries, and general inquiries, please reach out.</p>
  </div>


  <!-- ===================== CONTACT FORM (Formspree) =====================
       SETUP:
       1. Create a free account at formspree.io and make a new form.
       2. Formspree gives you an endpoint like https://formspree.io/f/abcdwxyz
       3. Paste it into action="" below, replacing YOUR_FORM_ID.
       4. Submit one test message from the live site, then confirm the email
          Formspree sends you. Messages arrive in the inbox you signed up with.

       How it works: each field's name="" becomes a line in the email.
       name="email" is special: Formspree uses it as the reply-to address,
       so Malia can just hit Reply. -->
  <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" novalidate>

    <!-- Subject line of the notification email Malia receives -->
    <input type="hidden" name="_subject" value="New inquiry from malianaiello.com">

    <div class="field-row">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Your full name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
    </div>

    <!-- Optional: helps Malia sort messages. Delete this block if not wanted. -->
    <div class="field">
      <label for="inquiry">Inquiry type</label>
      <select id="inquiry" name="inquiry_type">
        <option>Booking</option>
        <option>Casting</option>
        <option>General inquiry</option>
      </select>
    </div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Project, dates, location and any other details" required></textarea>
    </div>

    <!-- Honeypot: invisible to people; bots fill it in and Formspree discards the message -->
    <div class="hp" aria-hidden="true">
      <label for="gotcha">Leave this empty</label>
      <input id="gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
    </div>

    <button class="btn btn--solid btn--send" type="submit">Send Message</button>

    <!-- Success / error message appears here; aria-live reads it out to screen readers -->
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>


  <!-- ===================== REPRESENTATION =====================
       Matches the footer on the other pages. Confirm the agent name and email with Malia before launch.
       Need a second rep (e.g. management or a Los Angeles agent)?
       Copy the whole <div class="rep-card"> block. -->
  <section class="representation" aria-labelledby="rep-title">
    <h2 class="section-title" id="rep-title">Representation</h2>

    <div class="rep-grid">
      <div class="rep-card">
        <p class="eyebrow">Talent Agency</p>
        <h3>Bliss Models &amp; Talent</h3>
        <p>Lashauna</p>
        <a href="mailto:lashauna@blissmodels.com">lashauna@blissmodels.com</a>
        <!-- Optional phone line:
        <a href="tel:+18080000000">(808) 000-0000</a> -->
      </div>
    </div>

    <div class="contact-social">
      <span class="eyebrow">Follow</span>
      <div class="social">
        <a href="https://instagram.com/" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg>
        </a>
        <a class="imdb" href="https://www.imdb.com/" aria-label="IMDb">IMDb</a>
      </div>
    </div>
  </section>

  <div style="height: var(--section-y)"></div>
</main>

      <span class="footer-bar__copy">© <span id="year">2026</span> Malia Aiello</span>
      <span class="footer-bar__name">Malia Aiello</span>
      <span class="footer-bar__places">Hawaiʻi &nbsp;/&nbsp; Los Angeles &nbsp;/&nbsp; Worldwide</span>
    </div>
  </div>
</footer>

<script src="js/main.js" defer></script>
</body>
</html>
